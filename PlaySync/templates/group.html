<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaySync - Groups</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/group.css') }}">

</head>
<body class="dark-mode">
    <div class="nav-trigger" onclick="toggleSidebar()"><i class="fas fa-compact-disc"></i></div>
    
    <aside class="sidebar" id="sidebar">
        <ul class="menu-list">
            <li class="menu-item" onclick="location.href='/home'"><i class="fas fa-home"></i> Home</li>
            <li class="menu-item" onclick="location.href='/profile'"><i class="fas fa-user"></i> Profile</li>
            <li class="menu-item active-link" onclick="location.href='/group'"><i class="fas fa-users"></i> Groups</li>
            <li class="menu-item" onclick="location.href='/game'"><i class="fas fa-gamepad"></i> Games</li>
        </ul>
    </aside>

    <main class="main profile-mode">
        <header>
            <div class="search-bar"><i class="fas fa-search" style="opacity: 0.6;"></i><input type="text" placeholder="Search songs..."></div>
            <div class="header-right"><div class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></div></div>
        </header>

        <div class="group-container">
            <div class="group-sidebar">
                <div class="gs-header">
                    <h3>Your Jams</h3>
                    <div class="add-grp-btn" onclick="showCreateView()"><i class="fas fa-plus"></i></div>
                </div>
                <div id="group-list-content">
                    </div>
            </div>

            <div class="group-main-area" id="main-area">
                
                <div id="view-empty" class="placeholder-view">
                    <i class="fas fa-car-side" style="font-size: 4rem; color: var(--text-muted); margin-bottom: 20px;"></i>
                    <h2>Start a Jam</h2>
                    <p style="color: var(--text-muted);">Select a group or create a new one to start listening together.</p>
                    <button class="btn-primary" onclick="showCreateView()" style="margin-top: 20px;">Create New Group</button>
                </div>

                <div id="view-create" class="create-view" style="display: none;">
                    <h2 class="section-title" style="margin-top: 0;">Create New Jam</h2>
                    
                    <div class="input-group">
                        <label>Add Members</label>
                        <div class="friend-search-box">
                            <i class="fas fa-user-plus"></i>
                            <input type="text" id="friendSearchInput" placeholder="Search username..." onkeyup="searchFriends()">
                        </div>
                        <div class="search-results" id="searchResults"></div>
                    </div>

                    <div class="selected-friends" id="selectedFriends">
                        </div>

                    <div class="input-group" style="margin-top: 20px;">
                        <label>Group Name</label>
                        <input type="text" id="newGroupName" placeholder="e.g., Road Trip 2026" class="std-input">
                    </div>

                    <div class="action-row">
                        <button class="btn-secondary" onclick="cancelCreate()">Cancel</button>
                        <button class="btn-primary" onclick="finalizeGroup()">Create Jam</button>
                    </div>
                </div>

                <div id="view-active" class="active-jam-view" style="display: none;">
                    
                    <div class="jam-header">
                        <div>
                            <h2 id="activeGroupName">Road Trip</h2>
                            <span class="member-count" id="activeGroupMembers">3 Members • Active Now</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn-secondary" onclick="location.href='/game'"><i class="fas fa-gamepad"></i> Play Game</button>
                            <button class="icon-btn"><i class="fas fa-user-plus"></i></button>
                        </div>
                    </div>

                    <div class="jam-split">
                        <div class="jam-playlist">
                            <div class="playlist-controls">
                                <h4><i class="fas fa-magic" style="color: var(--accent);"></i> Auto-Generated Playlist</h4>
                                <div>
                                    <i class="fas fa-random ctrl-icon"></i>
                                    <i class="fas fa-play-circle ctrl-icon" style="color: var(--accent); font-size: 1.5rem;"></i>
                                </div>
                            </div>
                            <div class="jam-track-list" id="jamTrackList">
                                </div>
                        </div>

                        <div class="jam-chat">
                            <div class="chat-messages" id="chatWindow">
                                </div>
                            <div class="chat-input-bar">
                                <input type="text" id="chatInput" placeholder="Say something...">
                                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <!-- Player Bar (shared across pages) -->
    <div class="player-bar" id="player" data-song-id="">
        <div class="player-track-container">
            <span id="current-time">0:00</span>
            <div class="track-line-bg" onclick="seek(event)">
                <div class="track-line-fill" id="track-fill"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
        <div class="player-main-row">
            <div class="p-info">
                <div class="p-img" id="p-img" style="display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-music" style="color:#555;"></i>
                </div>
                <div class="p-text">
                    <h4 id="p-title">Select a song</h4>
                    <p id="p-artist">...</p>
                </div>
            </div>
            <div class="p-ctrls">
                <i class="fas fa-random ctrl-icon"></i>
                <i class="fas fa-step-backward ctrl-icon" onclick="playPrev()"></i>
                <div class="play-btn-main" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </div>
                <i class="fas fa-step-forward ctrl-icon" onclick="playNext()"></i>
                <i class="fas fa-redo ctrl-icon"></i>
            </div>
            <div class="p-extra">
                <i class="far fa-heart ctrl-icon" id="like-btn"></i>
                <i class="fas fa-volume-up ctrl-icon"></i>
                <input type="range" id="vol" min="0" max="100" value="80"
                    style="width:80px;accent-color:var(--accent);cursor:pointer;"
                    oninput="setVolume(this.value)">
            </div>
        </div>
    </div>
    <audio id="audio" preload="auto" crossorigin="anonymous"></audio>

    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
    <script src="{{ url_for('static', filename='js/group.js') }}"></script>

    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
    <script src="{{ url_for('static', filename='js/group.js') }}"></script>

</body>
</html>
