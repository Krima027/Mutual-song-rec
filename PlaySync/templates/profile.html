<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaySync - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="dark-mode">

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="loadProfileImage(event)">

    <div class="nav-trigger" onclick="toggleSidebar()"><i class="fas fa-compact-disc"></i></div>

    <aside class="sidebar" id="sidebar">
        <ul class="menu-list">
            <li class="menu-item" onclick="location.href='/home'"><i class="fas fa-home"></i> Home</li>
            <li class="menu-item active-link" onclick="location.href='/profile'"><i class="fas fa-user"></i> Profile</li>
            <li class="menu-item" onclick="location.href='/group'"><i class="fas fa-users"></i> Groups</li>
            <li class="menu-item" onclick="location.href='/game'"><i class="fas fa-gamepad"></i> Games</li>
        </ul>
    </aside>

    <main class="main profile-mode">
        <header>
            <div class="search-bar"><i class="fas fa-search" style="opacity: 0.6;"></i><input type="text" placeholder="Search..."></div>
            <div class="header-right">
                <div class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></div>
                <div class="icon-btn" style="color: var(--accent);"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="profile-header-container">
            <div class="profile-avatar-large" id="profilePic">
                <i class="fas fa-user"></i>
            </div>
            <div class="profile-info">
                <div class="profile-label">Spotify Account</div>
                <h1 class="profile-name" id="userName">{{ user.username }}</h1>
                <div class="profile-stats">
                    <div class="stats-item"><span id="stat-following">—</span> Following</div>
                    <div class="stats-item"><span id="stat-followers">—</span> Followers</div>
                </div>
                <div class="profile-actions">
                    <button class="btn-primary" onclick="editProfile()">Edit Profile</button>
                    <button class="btn-secondary" onclick="copyUsername()">Copy Username</button>
                </div>
            </div>
        </div>

        <!-- Friend Search Panel -->
        <div class="panel" style="margin-bottom:24px;">
            <div style="font-weight:700;font-size:1rem;margin-bottom:14px;">
                <i class="fas fa-user-plus" style="color:var(--accent);margin-right:8px;"></i>Find &amp; Follow by Username
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <input type="text" id="friendSearchUsername" placeholder="Enter exact username..."
                    style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--glass-border);background:var(--card-bg);color:var(--text-primary);font-size:0.9rem;outline:none;">
                <button class="btn-primary" onclick="searchAndFollow()" style="white-space:nowrap;">
                    <i class="fas fa-search"></i> Find
                </button>
            </div>
            <div id="friendSearchResult" style="margin-top:12px;"></div>
        </div>

        <div class="content-grid">
            <div class="left-col">
                <div class="section-header">
                    Public Playlists <span class="see-all">See All</span>
                </div>
                <div class="playlist-grid">
                    <div class="p-card">
                        <div class="p-img" style="background: linear-gradient(45deg, #3b82f6, #1d4ed8);"><i class="fas fa-music"></i></div>
                        <div class="p-title">Chill Vibes</div>
                        <div class="p-desc" id="p-desc-1">Player One</div>
                    </div>
                    <div class="p-card">
                        <div class="p-img" style="background: linear-gradient(45deg, #ec4899, #be185d);"><i class="fas fa-dumbbell"></i></div>
                        <div class="p-title">Workout</div>
                        <div class="p-desc" id="p-desc-2">Player One</div>
                    </div>
                    <div class="p-card">
                        <div class="p-img" style="background: linear-gradient(45deg, #eab308, #a16207);"><i class="fas fa-car"></i></div>
                        <div class="p-title">Road Trip</div>
                        <div class="p-desc" id="p-desc-3">Player One</div>
                    </div>
                    <div class="p-card">
                        <div class="p-img" style="background: linear-gradient(45deg, #22c55e, #15803d);"><i class="fas fa-book"></i></div>
                        <div class="p-title">Focus</div>
                        <div class="p-desc" id="p-desc-4">Player One</div>
                    </div>
                </div>
            </div>

            <div class="right-col">
                <div class="friends-panel">
                    <div class="section-header" style="margin-top: 0;">People You Follow</div>
                    <div id="following-list">
                        <div style="color:#aaa;font-size:0.85rem;padding:10px 0;">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>

</body>
</html>
