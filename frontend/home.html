<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaySync Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (THEMING) --- */
        :root {
            /* Default Dark Theme */
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --sidebar-bg: #050505;
            --card-bg: #181818;
            --card-hover: #282828;
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent: #c026d3;
            --player-bg: rgba(20, 20, 20, 0.98);
            --search-bg: rgba(255,255,255,0.1);
            --text-muted: #aaa;
            --track-bg: rgba(255,255,255,0.1);
        }

        /* Light Theme */
        body.light-mode {
            --bg-color: #f0f2f5; 
            --text-color: #1a1a1a;
            --sidebar-bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-hover: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.1);
            --accent: #d946ef;
            --player-bg: rgba(255, 255, 255, 0.95);
            --search-bg: #ffffff;
            --text-muted: #666;
            --track-bg: rgba(0,0,0,0.1);
            background: radial-gradient(circle at top left, #ffe4e6 0%, #e0f2fe 100%);
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            height: 100vh; 
            overflow: hidden; 
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: row;
        }
        
        a { text-decoration: none; color: inherit; }

        /* --- NAVIGATION BUTTON (CD Icon) --- */
        .nav-trigger {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 200;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-trigger i { font-size: 2.5rem; color: var(--accent); transition: transform 0.5s ease; }
        .nav-trigger:hover i { transform: rotate(90deg); }
        
        /* --- SLIDING SIDEBAR --- */
        .sidebar {
            position: relative;
            height: 100%;
            width: 0;
            background: var(--sidebar-bg);
            padding: 90px 0 0 0; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid var(--glass-border);
            overflow: hidden;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s;
            z-index: 150;
            flex-shrink: 0;
        }

        .sidebar.active { 
            width: 280px; 
            padding: 90px 20px 20px 20px;
        }

        .menu-item {
            padding: 15px 20px;
            border-radius: 15px;
            color: var(--text-color);
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            opacity: 0.7;
            white-space: nowrap;
            display: flex; align-items: center; gap: 15px;
        }
        .menu-item:hover, .menu-item.active-link { 
            background: var(--card-hover); 
            opacity: 1; 
            color: var(--accent);
        }
        .menu-item i { font-size: 1.2rem; min-width: 30px; text-align: center; }

        /* --- MAIN CONTENT --- */
        .main {
            flex: 1;
            padding: 30px 40px 160px 40px; /* Increased bottom padding for taller player */
            overflow-y: auto;
            width: 100%;
            transition: margin 0.4s;
            position: relative; /* For absolute search bar */
        }

        /* Header (Search Centered) */
        header { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            margin-bottom: 40px; 
            gap: 20px;
            padding-left: 60px;
            position: relative;
            height: 50px;
        }
        
        /* Centered Search Bar */
        .search-bar {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 400px; padding: 12px 25px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px; 
            background: var(--search-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .search-bar input { background: transparent; border: none; color: var(--text-color); width: 100%; outline: none; }

        /* Right Side Buttons */
        .header-right { display: flex; align-items: center; gap: 15px; z-index: 20; }

        .theme-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--card-bg); border: 1px solid var(--glass-border);
            color: var(--text-color); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; transition: 0.3s;
        }
        .theme-btn:hover { background: var(--card-hover); }

        /* Generic Profile Icon */
        .profile-icon {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--card-bg); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .profile-icon:hover { background: var(--card-hover); color: var(--accent); }


        /* --- SECTIONS --- */
        .section-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; margin-top: 35px; }

        /* VIBE CARDS */
        .vibe-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        .vibe-card {
            height: 140px; border-radius: 20px; padding: 20px; 
            display: flex; flex-direction: column; justify-content: flex-end;
            color: #fff; cursor: pointer; transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .vibe-card:hover { transform: translateY(-5px); }
        .v-pop { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .v-chill { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .v-indie { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .v-rock { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
        .v-card-icon { font-size: 1.5rem; margin-bottom: auto; opacity: 0.9; }
        .v-card-title { font-weight: 700; font-size: 1.1rem; }

        /* MIDDLE SECTION */
        .mid-grid { 
            display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; margin-top: 35px; 
        }
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px; padding: 25px;
            backdrop-filter: blur(10px);
        }

        /* Artists (Pic 1 Style - Cleaner, sharper) */
        .artist-row { display: flex; justify-content: space-around; align-items: center; padding-top: 15px; }
        .artist-circle { display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; }
        .artist-img { 
            width: 85px; height: 85px; border-radius: 50%; background-size: cover; background-position: center; 
            /* Cleaner border and shadow for premium feel */
            border: 3px solid var(--card-bg); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .artist-circle:hover .artist-img { 
            border-color: var(--accent); 
            transform: translateY(-5px) scale(1.05); 
            box-shadow: 0 12px 25px rgba(192, 38, 211, 0.3);
        }
        .artist-name { font-size: 0.9rem; font-weight: 700; }

        /* Chart */
        .chart-area { display: flex; justify-content: center; align-items: flex-end; height: 100px; gap: 12px; }
        .bar { width: 12px; background: var(--accent); border-radius: 6px; opacity: 0.4; transition: 0.3s; }
        .bar:hover { opacity: 1; transform: scaleY(1.1); }

        /* SUGGESTED LIST */
        .song-list { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .song-row {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 12px 20px; border-radius: 15px; cursor: pointer; transition: 0.2s;
        }
        .song-row:hover { background: var(--card-hover); }
        .s-info { display: flex; align-items: center; gap: 15px; }
        .s-img { width: 50px; height: 50px; border-radius: 12px; background-size: cover; }
        .play-mini { 
            width: 38px; height: 38px; border-radius: 50%; background: var(--bg-color); 
            color: var(--text-color); display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .song-row:hover .play-mini { background: var(--accent); color: #fff; }

        /* --- PLAYER BAR (Pic 2 Style - with Track Line) --- */
        .player-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 1100px; 
            /* Taller height to accommodate track line */
            height: auto; padding: 20px 30px;
            background: var(--player-bg);
            backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 200;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        /* 1. Progress Track Row */
        .player-track-container {
            width: 100%; display: flex; align-items: center; gap: 15px;
            font-size: 0.75rem; color: var(--text-muted); font-weight: 600;
        }
        .track-line-bg {
            flex: 1; height: 5px; background: var(--track-bg);
            border-radius: 3px; cursor: pointer; position: relative; overflow: hidden;
        }
        .track-line-fill {
            width: 0%; height: 100%; background: var(--accent); border-radius: 3px;
            transition: width 0.1s linear;
        }

        /* 2. Controls & Info Row */
        .player-main-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .p-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .p-img { width: 55px; height: 55px; border-radius: 14px; background-size: cover; background-color: #222; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .p-text h4 { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
        .p-text p { font-size: 0.8rem; color: var(--text-muted); }

        .p-ctrls { display: flex; align-items: center; gap: 25px; font-size: 1.3rem; color: var(--text-color); flex: 1; justify-content: center; }
        .ctrl-icon { cursor: pointer; transition: 0.2s; opacity: 0.8; }
        .ctrl-icon:hover { opacity: 1; color: var(--accent); }
        .play-btn-main {
            width: 55px; height: 55px; background: var(--accent); color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 1.4rem; box-shadow: 0 5px 20px rgba(192, 38, 211, 0.4);
            transition: transform 0.2s;
        }
        .play-btn-main:active { transform: scale(0.95); }

        .p-extra { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: flex-end; color: var(--text-muted); font-size: 1.1rem;}

        @media (max-width: 900px) {
            .mid-grid { grid-template-columns: 1fr; }
            .search-bar { max-width: 300px; }
            .player-bar { padding: 15px 20px; bottom: 15px; }
            .p-img { width: 45px; height: 45px; }
            .play-btn-main { width: 45px; height: 45px; font-size: 1.2rem; }
        }
    </style>
</head>
<body class="dark-mode"> 
    
    <audio id="audio" src="song1.mp3"></audio>

    <div class="nav-trigger" onclick="toggleSidebar()">
        <i class="fas fa-compact-disc"></i>
    </div>

    <aside class="sidebar" id="sidebar">
        <ul class="menu-list">
            <li class="menu-item active-link" onclick="location.href='home.html'"><i class="fas fa-home"></i> Home</li>
            <li class="menu-item" onclick="location.href='profile.html'"><i class="fas fa-user"></i> Profile</li>
            <li class="menu-item" onclick="location.href='groups.html'"><i class="fas fa-users"></i> Groups</li>
            <li class="menu-item" onclick="location.href='chat.html'"><i class="fas fa-comment-dots"></i> Chat</li>
            <li class="menu-item" onclick="location.href='games.html'"><i class="fas fa-gamepad"></i> Games</li>
            <li class="menu-item" onclick="location.href='liked.html'"><i class="fas fa-heart"></i> Liked</li>
            <li class="menu-item" onclick="location.href='history.html'"><i class="fas fa-history"></i> History</li>
            <li class="menu-item" style="margin-top: auto;" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</li>
        </ul>
    </aside>

    <main class="main">
        
        <header>
            <div class="search-bar">
                <i class="fas fa-search" style="opacity: 0.6;"></i>
                <input type="text" placeholder="Search artists, songs...">
            </div>
            
            <div class="header-right">
                <div class="theme-btn" onclick="toggleTheme()">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </div>
                <a href="profile.html">
                    <div class="profile-icon">
                        <i class="fas fa-user"></i>
                    </div>
                </a>
            </div>
        </header>

        <h2 class="section-title">Your Vibe</h2>
        <div class="vibe-grid">
            <div class="vibe-card v-pop">
                <i class="fas fa-bolt v-card-icon"></i>
                <span class="v-card-title">Pop Hits</span>
            </div>
            <div class="vibe-card v-chill">
                <i class="fas fa-coffee v-card-icon"></i>
                <span class="v-card-title">Chill</span>
            </div>
            <div class="vibe-card v-indie">
                <i class="fas fa-guitar v-card-icon"></i>
                <span class="v-card-title">Indie</span>
            </div>
            <div class="vibe-card v-rock">
                <i class="fas fa-drum v-card-icon"></i>
                <span class="v-card-title">Rock</span>
            </div>
        </div>

        <div class="mid-grid">
            <div class="panel">
                <div style="margin-bottom: 20px; font-weight: 700; font-size: 1.1rem;">Favorite Artists</div>
                <div class="artist-row">
                    <div class="artist-circle" onclick="playSong('Blinding Lights', 'The Weeknd')">
                        <div class="artist-img" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/e/e6/The_Weeknd_-_Blinding_Lights.png');"></div>
                        <span class="artist-name">Weeknd</span>
                    </div>
                    <div class="artist-circle">
                        <div class="artist-img" style="background-image: url('https://i.scdn.co/image/ab6761610000e5ebcdce7620dc940db079bf4952');"></div>
                        <span class="artist-name">Ariana</span>
                    </div>
                    <div class="artist-circle">
                        <div class="artist-img" style="background-color: #333;"></div>
                        <span class="artist-name">Drake</span>
                    </div>
                    <div class="artist-circle">
                        <div class="artist-img" style="background-color: #555;"></div>
                        <span class="artist-name">Taylor</span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div style="margin-bottom: 20px; font-weight: 700; font-size: 1.1rem;">Weekly Activity</div>
                <div class="chart-area">
                    <div class="bar" style="height: 30%;"></div>
                    <div class="bar" style="height: 50%;"></div>
                    <div class="bar" style="height: 80%;"></div>
                    <div class="bar" style="height: 40%;"></div>
                    <div class="bar" style="height: 60%;"></div>
                    <div class="bar" style="height: 90%;"></div>
                    <div class="bar" style="height: 50%;"></div>
                </div>
            </div>
        </div>

        <h2 class="section-title">Suggested For You</h2>
        <div class="song-list">
            <div class="song-row" onclick="playSong('As It Was', 'Harry Styles')">
                <div class="s-info">
                    <div class="s-img" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/d/d5/Harry_Styles_-_As_It_Was.png'); background-color: #f43f5e;"></div>
                    <div>
                        <div style="font-weight: 700;">As It Was</div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">Harry Styles</div>
                    </div>
                </div>
                <div class="play-mini"><i class="fas fa-play"></i></div>
            </div>
            <div class="song-row" onclick="playSong('Flowers', 'Miley Cyrus')">
                <div class="s-info">
                    <div class="s-img" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/7/72/Miley_Cyrus_-_Flowers.png'); background-color: #eab308;"></div>
                    <div>
                        <div style="font-weight: 700;">Flowers</div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">Miley Cyrus</div>
                    </div>
                </div>
                <div class="play-mini"><i class="fas fa-play"></i></div>
            </div>
        </div>
    </main>

    <div class="player-bar">
        <div class="player-track-container">
            <span id="current-time">0:00</span>
            <div class="track-line-bg" onclick="seek(event)">
                <div class="track-line-fill" id="track-fill"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>

        <div class="player-main-row">
            <div class="p-info">
                <div class="p-img" id="p-img"></div>
                <div class="p-text">
                    <h4 id="p-title">Select Song</h4>
                    <p id="p-artist">...</p>
                </div>
            </div>
            
            <div class="p-ctrls">
                <i class="fas fa-random ctrl-icon"></i>
                <i class="fas fa-step-backward ctrl-icon"></i>
                <div class="play-btn-main" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </div>
                <i class="fas fa-step-forward ctrl-icon"></i>
                <i class="fas fa-redo ctrl-icon"></i>
            </div>

            <div class="p-extra">
                <i class="far fa-heart ctrl-icon" onclick="this.classList.toggle('fas'); this.classList.toggle('far'); this.style.color = this.classList.contains('fas') ? var(--accent) : inherit;"></i>
                <i class="fas fa-volume-up ctrl-icon"></i>
            </div>
        </div>
    </div>

    <script>
        const body = document.body;
        const sidebar = document.getElementById('sidebar');
        const themeIcon = document.getElementById('theme-icon');
        const audio = document.getElementById('audio');
        const playIcon = document.getElementById('playIcon');
        const pTitle = document.getElementById('p-title');
        const pArtist = document.getElementById('p-artist');
        const pImg = document.getElementById('p-img');
        const trackFill = document.getElementById('track-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        let isPlaying = false;

        // --- THEME TOGGLE ---
        function toggleTheme() {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        // --- SIDEBAR TOGGLE ---
        function toggleSidebar() {
            sidebar.classList.toggle('active');
        }

        // --- PLAYER LOGIC ---
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            } else {
                audio.play().catch(e => console.log('Simulated Play'));
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            }
            isPlaying = !isPlaying;
        }

        function playSong(title, artist) {
            pTitle.innerText = title;
            pArtist.innerText = artist;
            pImg.style.backgroundColor = "#" + Math.floor(Math.random()*16777215).toString(16);
            if(!isPlaying) togglePlay();
        }

        // Progress Bar Update
        audio.ontimeupdate = function() {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                trackFill.style.width = percent + "%";
                currentTimeEl.innerText = formatTime(audio.currentTime);
            }
        };

        // Set Total Time
        audio.onloadedmetadata = function() {
            totalTimeEl.innerText = formatTime(audio.duration);
        }

        // Seek functionality
        function seek(e) {
            const bar = e.currentTarget;
            const percent = e.offsetX / bar.offsetWidth;
            trackFill.style.width = (percent * 100) + "%";
            if(audio.duration) audio.currentTime = percent * audio.duration;
        }

        // Fake progress for UI demo if no audio loads
        setInterval(() => {
            if(isPlaying && !audio.duration) {
                let w = parseFloat(trackFill.style.width) || 0;
                if(w >= 100) w = 0;
                trackFill.style.width = (w + 0.5) + "%";
            }
        }, 100);

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
